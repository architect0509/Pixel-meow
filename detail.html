<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel-meow - 작품 상세 관리</title>
  <link rel="icon" href="./Asset/IconFit.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+KR:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1b1b1f;
      --bg-deep: #141417;
      --surface: #25252b;
      --surface-2: #2e2e36;
      --line: #3b3b45;
      --text: #e8e8ee;
      --muted: #9a9aa8;
      --accent: #e9bd0c;
      --accent-dim: rgba(233, 189, 12, 0.14);
      --accent-ink: #1a1500;
      --danger: #d9534f;
      --info: #3d8fd1;
      --ok: #3fae5a;
      --font-pixel: 'Press Start 2P', monospace;
      --font-dot: 'DotGothic16', 'Noto Sans KR', sans-serif;
      --font-body: 'Noto Sans KR', 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    img { image-rendering: pixelated; }
    button, input { font-family: inherit; }

    /* ---------- NAV ---------- */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(20, 20, 23, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 2px solid #000;
      box-shadow: 0 2px 0 var(--line);
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
    .brand img { width: 32px; height: 32px; }
    .brand-name {
      font-family: var(--font-pixel);
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #000;
    }

    /* ---------- BUTTONS ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      font-family: var(--font-dot);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      border: 2px solid #000;
      background: var(--surface-2);
      color: var(--text);
      box-shadow: inset -3px -3px 0 rgba(0,0,0,0.35), inset 3px 3px 0 rgba(255,255,255,0.08), 3px 3px 0 #000;
      transition: transform .08s ease, box-shadow .08s ease, background .15s ease;
    }
    .btn:hover { background: #3a3a44; }
    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: inset -3px -3px 0 rgba(0,0,0,0.35), inset 3px 3px 0 rgba(255,255,255,0.08), 0 0 0 #000;
    }
    .btn:focus-visible, .field:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { background: #f5cc2e; }
    .btn-info { background: var(--info); color: #fff; }
    .btn-info:hover { background: #4fa0e2; }
    .btn-ok { background: var(--ok); color: #fff; }
    .btn-ok:hover { background: #4cc56b; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #e4625e; }
    .btn-sm { padding: 0 16px; font-size: 13px; height: 42px; }

    /* ---------- LAYOUT ---------- */
    main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 72px;
    }

    .crumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--muted);
    }
    .crumb a { color: var(--muted); text-decoration: none; }
    .crumb a:hover { color: var(--accent); }
    .crumb .sep { color: var(--line); }
    .crumb .here { color: var(--text); }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 100px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .loader { display: flex; gap: 8px; }
    .loader i {
      width: 14px; height: 14px;
      background: var(--accent);
      border: 2px solid #000;
      animation: hop .8s steps(4, end) infinite;
    }
    .loader i:nth-child(2) { animation-delay: .15s; background: #6ec1ff; }
    .loader i:nth-child(3) { animation-delay: .3s; background: #ff7a90; }
    @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .detail {
      display: none;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 32px;
      align-items: start;
      animation: popIn .35s steps(5, end) backwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------- PANELS ---------- */
    .panel {
      background: var(--surface);
      border: 2px solid #000;
      box-shadow: inset 2px 2px 0 rgba(255,255,255,0.05), 5px 5px 0 #000;
    }

    .preview-box {
      position: relative;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      border-bottom: 2px solid #000;
      background-color: #17171b;
      background-image:
        linear-gradient(45deg, #202026 25%, transparent 25%),
        linear-gradient(-45deg, #202026 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #202026 75%),
        linear-gradient(-45deg, transparent 75%, #202026 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    /* 작은 픽셀 이미지(예: 32x32)도 박스에 꽉 차게 선명한 정수 느낌으로 확대 */
    .preview-img { width: 100%; height: 100%; object-fit: contain; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px; }
    .chip {
      font-family: var(--font-pixel);
      font-size: 9px;
      padding: 7px 9px;
      color: var(--muted);
      background: var(--bg-deep);
      border: 1px solid var(--line);
    }
    .chip.hot { color: var(--accent-ink); background: var(--accent); border: 2px solid #000; }

    .side { display: flex; flex-direction: column; gap: 24px; }

    .panel-body { padding: 22px; display: flex; flex-direction: column; gap: 20px; }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-dot);
      font-size: 20px;
      color: #fff;
    }
    .panel-title::before {
      content: '';
      width: 10px; height: 20px;
      background: var(--accent);
      box-shadow: 4px 0 0 #000;
    }

    .group { display: flex; flex-direction: column; gap: 8px; }
    .group label { font-size: 12px; font-weight: 700; color: var(--muted); }
    .row { display: flex; gap: 8px; }

    .field {
      flex: 1;
      min-width: 0;
      height: 42px;
      background: var(--bg-deep);
      border: 2px solid #000;
      color: var(--text);
      font-size: 14px;
      padding: 0 12px;
      outline: none;
      box-shadow: inset 2px 2px 0 rgba(0,0,0,0.5), 0 2px 0 var(--line);
      transition: box-shadow .15s ease;
    }
    .field:focus { box-shadow: inset 2px 2px 0 rgba(0,0,0,0.5), 0 2px 0 var(--accent); }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions .wide { grid-column: 1 / -1; }

    .danger-zone { border-top: 2px dashed var(--line); padding-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .danger-zone span { font-size: 12px; color: var(--muted); line-height: 1.5; }

    /* ---------- MODAL ---------- */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,0.8);
    }
    .modal.show { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 2px solid #000;
      box-shadow: inset 2px 2px 0 rgba(255,255,255,0.05), 6px 6px 0 #000;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: popIn .2s steps(4, end);
    }
    .modal-box h3 { font-family: var(--font-dot); font-size: 20px; color: #fff; font-weight: 400; }
    .modal-box p { font-size: 13px; line-height: 1.6; color: var(--muted); }
    .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
    .modal-actions .btn { flex: 1; }

    /* ---------- TOAST ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translate(-50%, 20px);
      z-index: 200;
      padding: 12px 18px;
      font-family: var(--font-dot);
      font-size: 14px;
      color: var(--accent-ink);
      background: var(--accent);
      border: 2px solid #000;
      box-shadow: 4px 4px 0 #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.error { background: var(--danger); color: #fff; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- PREVIEW MODAL ---------- */
    .modal-box.preview-modal { max-width: 560px; align-items: center; }
    .preview-stage {
      width: 100%;
      min-height: 240px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #000;
      background-color: #777;
    }
    .preview-stage canvas { image-rendering: pixelated; max-width: 100%; max-height: 50vh; }
    .bg-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .bg-row span { font-size: 12px; color: var(--muted); }
    .btn-xs { padding: 0 12px; font-size: 12px; height: 32px; }

    @media (max-width: 820px) {
      .detail { grid-template-columns: 1fr; }
      main { padding: 28px 16px 56px; }
      .nav-inner { padding: 10px 16px; }
      .brand-name { font-size: 11px; }
      .preview-box { aspect-ratio: 4 / 3; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>

  <script src="./gallery-store.js"></script>
  <script type="module">

    const urlParams = new URLSearchParams(window.location.search);
    const artId = urlParams.get('id');

    let currentArtData = null;

    const $ = (id) => document.getElementById(id);

    let toastTimer = null;
    function toast(msg, isError = false) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.toggle('error', isError);
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    // 삭제 확인 모달 (confirm 대체)
    function openDeleteModal() { $('deleteModal').classList.add('show'); }
    function closeDeleteModal() { $('deleteModal').classList.remove('show'); }

    function renderChips(data) {
      const wrap = $('chips');
      wrap.innerHTML = '';
      const add = (text, hot) => {
        const s = document.createElement('span');
        s.className = 'chip' + (hot ? ' hot' : '');
        s.textContent = text;
        wrap.appendChild(s);
      };
      if (data.width && data.height) add(`${data.width}x${data.height}`);
      const fc = Array.isArray(data.frames) ? data.frames.length : 0;
      if (fc > 1) add(`${fc} FRAMES`, true);
      else add('1 FRAME');
      if (data.createdAt) {
        const d = new Date(data.createdAt);
        add(`${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`);
      }
    }

    async function loadArtDetail() {
      if (!artId) {
        alert("잘못된 접근입니다.");
        window.location.href = './index.html';
        return;
      }

      try {
        const art = await window.pixelGallery.get(artId);

        if (!art) {
          alert("존재하지 않거나 삭제된 작품입니다.");
          window.location.href = './index.html';
          return;
        }

        currentArtData = art;

        $('loadingView').style.display = 'none';
        $('contentView').style.display = 'grid';

        $('previewImg').src = currentArtData.preview || '';
        $('titleInput').value = currentArtData.title || '';
        $('authorInput').value = currentArtData.author || '';
        $('crumbTitle').textContent = currentArtData.title || '제목 없음';
        renderChips(currentArtData);

      } catch (err) {
        console.error(err);
        toast("작품 정보를 불러오는 중 오류가 발생했습니다.", true);
      }
    }

    // 1. 제목 수정
    async function handleUpdateTitle() {
      const newTitle = $('titleInput').value.trim();
      if (!newTitle) {
        toast("제목을 입력해주세요.", true);
        return;
      }
      try {
        await window.pixelGallery.update(artId, { title: newTitle });
        currentArtData.title = newTitle;
        $('crumbTitle').textContent = newTitle;
        toast("작품 제목이 수정되었습니다!");
      } catch (err) {
        console.error(err);
        toast("제목 수정 중 오류가 발생했습니다.", true);
      }
    }

    // 2. 내용(작가명/설명) 수정
    async function handleUpdateAuthor() {
      const newAuthor = $('authorInput').value.trim();
      if (!newAuthor) {
        toast("내용을 입력해주세요.", true);
        return;
      }
      try {
        await window.pixelGallery.update(artId, { author: newAuthor });
        currentArtData.author = newAuthor;
        toast("작품 내용이 수정되었습니다!");
      } catch (err) {
        console.error(err);
        toast("내용 수정 중 오류가 발생했습니다.", true);
      }
    }

    // 3. 이어서 작업하기
    function handleContinueWork() {
      if (!currentArtData) return;
      // 작품 데이터는 캔버스가 로컬 갤러리에서 id로 직접 읽어오므로 id만 넘김
      sessionStorage.setItem('edit_target_art_id', artId);
      window.location.href = './canvas/canvas.html';
    }

    // 4. 작품 복제하기
    async function handleDuplicateArt() {
      if (!currentArtData) return;
      const btn = $('duplicateBtn');
      btn.disabled = true;
      try {
        const copy = {
          title: (currentArtData.title || '작품') + ' (복사본)',
          author: currentArtData.author || '나',
          preview: currentArtData.preview,
          width: currentArtData.width || 16,
          height: currentArtData.height || 16
        };
        if (currentArtData.fps) copy.fps = currentArtData.fps;
        // 프레임/레이어 데이터도 함께 복제해야 복사본에서 이어서 작업할 때 구조가 유지됨
        if (Array.isArray(currentArtData.frames)) copy.frames = currentArtData.frames;

        const newId = await window.pixelGallery.add(copy);

        toast("작품이 성공적으로 복제되었습니다!");
        setTimeout(() => { window.location.href = `./detail.html?id=${newId}`; }, 700);
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        toast("복제 중 오류가 발생했습니다.", true);
      }
    }

    // 5. 작품 삭제
    async function handleDeleteArt() {
      const btn = $('confirmDeleteBtn');
      btn.disabled = true;
      try {
        await window.pixelGallery.remove(artId);

        closeDeleteModal();
        toast("작품이 삭제되었습니다.");
        setTimeout(() => { window.location.href = './index.html'; }, 700);
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        closeDeleteModal();
        toast("삭제 중 오류가 발생했습니다.", true);
      }
    }

    // 6. 미리보기 재생 (프레임/레이어를 합성해서 FPS대로 반복 재생)
    let previewTimer = null;

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('이미지를 불러오지 못했습니다.'));
        img.src = src;
      });
    }

    // 저장된 프레임 데이터 → 합성된 프레임 캔버스 배열
    async function buildPreviewFrames(art) {
      const w = art.width || 16;
      const h = art.height || 16;
      const out = [];

      if (Array.isArray(art.frames) && art.frames.length > 0) {
        for (const f of art.frames) {
          if (f.visible === false) continue;
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          for (const l of (f.layers || [])) {
            if (l.visible === false || !l.dataUrl) continue;
            ctx.drawImage(await loadImage(l.dataUrl), 0, 0, w, h);
          }
          out.push(c);
        }
      }

      // 프레임 정보가 없는 예전 작품이면 저장된 미리보기 이미지 한 장으로 대체
      if (out.length === 0 && art.preview) {
        const img = await loadImage(art.preview);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        out.push(c);
      }
      return out;
    }

    function stopPreview() {
      if (previewTimer) { clearInterval(previewTimer); previewTimer = null; }
      $('previewModal').classList.remove('show');
    }

    async function openPreview() {
      if (!currentArtData) return;
      const btn = $('previewBtn');
      btn.disabled = true;
      try {
        const list = await buildPreviewFrames(currentArtData);
        if (list.length === 0) { toast("재생할 프레임이 없어요.", true); return; }

        const w = currentArtData.width || list[0].width;
        const h = currentArtData.height || list[0].height;
        const cv = $('previewModalCanvas');
        cv.width = w * 16;
        cv.height = h * 16;
        const ctx = cv.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const fps = Math.max(1, Math.min(60, parseInt(currentArtData.fps) || 6));
        let idx = 0;
        const draw = () => {
          ctx.clearRect(0, 0, cv.width, cv.height);
          ctx.drawImage(list[idx], 0, 0, cv.width, cv.height);
          idx = (idx + 1) % list.length;
        };

        if (previewTimer) clearInterval(previewTimer);
        draw();
        if (list.length > 1) previewTimer = setInterval(draw, 1000 / fps);

        $('previewInfo').textContent = list.length > 1
          ? `${list.length}프레임 · ${fps} FPS 반복 재생`
          : '1프레임 작품이에요.';
        $('previewModal').classList.add('show');
      } catch (err) {
        console.error(err);
        toast("미리보기를 불러오는 중 오류가 발생했습니다.", true);
      } finally {
        btn.disabled = false;
      }
    }

    function setPreviewBg(color) {
      $('previewStage').style.backgroundColor = color;
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadArtDetail();

      $('previewBtn').addEventListener('click', openPreview);
      $('closePreviewBtn').addEventListener('click', stopPreview);
      $('previewModal').addEventListener('click', (e) => { if (e.target === $('previewModal')) stopPreview(); });
      $('bgGrayBtn').addEventListener('click', () => setPreviewBg('#777777'));
      $('bgWhiteBtn').addEventListener('click', () => setPreviewBg('#ffffff'));
      $('bgBlackBtn').addEventListener('click', () => setPreviewBg('#000000'));

      $('updateTitleBtn').addEventListener('click', handleUpdateTitle);
      $('updateAuthorBtn').addEventListener('click', handleUpdateAuthor);
      $('titleInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleUpdateTitle(); });
      $('authorInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleUpdateAuthor(); });
      $('continueBtn').addEventListener('click', handleContinueWork);
      $('duplicateBtn').addEventListener('click', handleDuplicateArt);
      $('deleteBtn').addEventListener('click', openDeleteModal);
      $('cancelDeleteBtn').addEventListener('click', closeDeleteModal);
      $('confirmDeleteBtn').addEventListener('click', handleDeleteArt);
      $('deleteModal').addEventListener('click', (e) => { if (e.target === $('deleteModal')) closeDeleteModal(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeDeleteModal(); stopPreview(); } });
      $('exitBtn').addEventListener('click', () => { window.location.href = './index.html'; });
    });
  </script>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="./index.html" class="brand">
        <img src="./Asset/IconFit.png" alt="">
        <span class="brand-name">PIXEL-MEOW</span>
      </a>
      <a href="./index.html" class="btn">← 내 갤러리</a>
    </div>
  </nav>

  <main>
    <div class="crumb">
      <a href="./index.html">내 갤러리</a>
      <span class="sep">/</span>
      <span class="here" id="crumbTitle">작품 상세</span>
    </div>

    <div id="loadingView" class="loading">
      <div class="loader"><i></i><i></i><i></i></div>
      <span>작품 정보를 가져오는 중...</span>
    </div>

    <div id="contentView" class="detail">
      <!-- 미리보기 -->
      <section class="panel">
        <div class="preview-box">
          <img id="previewImg" class="preview-img" alt="Pixel Art Preview">
        </div>
        <div class="chips" id="chips"></div>
      </section>

      <!-- 정보 / 액션 -->
      <div class="side">
        <section class="panel">
          <div class="panel-body">
            <h2 class="panel-title">작품 정보</h2>

            <div class="group">
              <label for="titleInput">작품 제목</label>
              <div class="row">
                <input type="text" id="titleInput" class="field" maxlength="60" autocomplete="off">
                <button id="updateTitleBtn" class="btn btn-info btn-sm">저장</button>
              </div>
            </div>

            <div class="group">
              <label for="authorInput">내용 (작가명 / 설명)</label>
              <div class="row">
                <input type="text" id="authorInput" class="field" maxlength="60" autocomplete="off">
                <button id="updateAuthorBtn" class="btn btn-info btn-sm">저장</button>
              </div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-body">
            <h2 class="panel-title">작업</h2>

            <div class="actions">
              <button id="continueBtn" class="btn btn-primary wide">이어서 작업하기</button>
              <button id="previewBtn" class="btn btn-info wide">▶ 미리보기 재생</button>
              <button id="duplicateBtn" class="btn btn-ok">작품 복제</button>
              <button id="exitBtn" class="btn">나가기</button>
            </div>

            <div class="danger-zone">
              <span>삭제한 작품은<br>복구할 수 없어요.</span>
              <button id="deleteBtn" class="btn btn-danger">작품 삭제</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- 삭제 확인 모달 -->
  <div class="modal" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
    <div class="modal-box">
      <h3 id="deleteTitle">정말 삭제할까요?</h3>
      <p>이 작품을 삭제하면 복구할 수 없어요.</p>
      <div class="modal-actions">
        <button id="cancelDeleteBtn" class="btn">취소</button>
        <button id="confirmDeleteBtn" class="btn btn-danger">삭제</button>
      </div>
    </div>
  </div>

  <!-- 미리보기 모달 -->
  <div class="modal" id="previewModal" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="modal-box preview-modal">
      <h3 id="previewTitle">미리보기</h3>
      <div class="preview-stage" id="previewStage">
        <canvas id="previewModalCanvas"></canvas>
      </div>
      <p id="previewInfo"></p>
      <div class="bg-row">
        <span>배경</span>
        <button id="bgGrayBtn" class="btn btn-xs">회색</button>
        <button id="bgWhiteBtn" class="btn btn-xs">흰색</button>
        <button id="bgBlackBtn" class="btn btn-xs">검은색</button>
      </div>
      <div class="modal-actions" style="width:100%;">
        <button id="closePreviewBtn" class="btn">닫기</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
