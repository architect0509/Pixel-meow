<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel-meow - 작품 상세 관리</title>
  <link rel="icon" href="../Asset/IconFit.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #282828;
      color: #cccccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    top-nav {
      background-color: #383838;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e1e1e;
    }

    .nav-title {
      font-size: 16px;
      font-weight: bold;
      color: #e9bd0c;
    }

    .nav-btn {
      background: #4a4a4a;
      border: 1px solid #555;
      color: #fff;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
    }
    .nav-btn:hover { background: rgb(100, 100, 100); }

    container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 24px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .detail-card {
      background-color: #333333;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 24px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .preview-box {
      width: 100%;
      height: 300px;
      background-color: #1e1e1e;
      background-image: 
        linear-gradient(45deg, #2d2d2d 25%, transparent 25%), 
        linear-gradient(-45deg, #2d2d2d 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #2d2d2d 75%), 
        linear-gradient(-45deg, transparent 75%, #2d2d2d 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 6px;
      border: 1px solid #444;
      padding: 20px;
    }

    .preview-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .info-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-group label {
      font-size: 12px;
      color: #aaa;
      font-weight: bold;
    }

    /* 입력창과 옆의 저장 버튼을 가로로 배치하기 위한 레이아웃 */
    .input-row {
      display: flex;
      gap: 8px;
    }

    .info-input {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #555;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }
    .info-input:focus { border-color: #e9bd0c; }

    .btn-inline-save {
      background: #0e639c;
      border: 1px solid #1177bb;
      color: #fff;
      padding: 0 16px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-inline-save:hover { background: #1177bb; }

    .action-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .action-btn {
      padding: 10px;
      border-radius: 4px;
      border: none;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      color: #fff;
      text-align: center;
    }

    .btn-continue { background: #00838f; }
    .btn-continue:hover { background: #0097a7; }

    .btn-duplicate { background: #388e3c; }
    .btn-duplicate:hover { background: #4caf50; }

    .btn-delete { background: #d9534f; }
    .btn-delete:hover { background: #d43f3a; }

    .btn-exit {
      background: #444;
      border: 1px solid #555;
      color: #fff;
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px;
      text-align: center;
    }
    .btn-exit:hover { background: #555; }

    .loading-msg {
      text-align: center;
      padding: 60px;
      color: #888;
      font-size: 14px;
    }

    .header-divider {
      width: 400px;
      height: 1px;
      background-color: #555;
      margin: 20px 0 20px 0;
      align-self: center;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, deleteDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD_pvFCpVjc0enadMXuHbMcv4TC9NSLdHc",
      authDomain: "pixel-meow-project.firebaseapp.com",
      projectId: "pixel-meow-project",
      storageBucket: "pixel-meow-project.firebasestorage.app",
      messagingSenderId: "894944756752",
      appId: "1:894944756752:web:77a8055b615590a39ff695",
      measurementId: "G-W9K4ZVSHVY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const artId = urlParams.get('id');

    let currentArtData = null;

    async function loadArtDetail() {
      if (!artId) {
        alert("잘못된 접근입니다.");
        window.location.href = './index.html';
        return;
      }

      try {
        const docRef = doc(db, "arts", artId);
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          alert("존재하지 않거나 삭제된 작품입니다.");
          window.location.href = './index.html';
          return;
        }

        currentArtData = docSnap.data();

        document.getElementById('loadingView').style.display = 'none';
        document.getElementById('contentView').style.display = 'flex';

        document.getElementById('previewImg').src = currentArtData.preview;
        document.getElementById('titleInput').value = currentArtData.title || '';
        document.getElementById('authorInput').value = currentArtData.author || '';

      } catch (err) {
        console.error(err);
        alert("작품 정보를 불러오는 중 오류가 발생했습니다.");
      }
    }

    // 1. 제목 개별 수정 저장
    async function handleUpdateTitle() {
      const newTitle = document.getElementById('titleInput').value.trim();
      if (!newTitle) {
        alert("제목을 입력해주세요.");
        return;
      }

      try {
        const docRef = doc(db, "arts", artId);
        await updateDoc(docRef, { title: newTitle });
        alert("작품 제목이 수정되었습니다!");
      } catch (err) {
        console.error(err);
        alert("제목 수정 중 오류가 발생했습니다.");
      }
    }

    // 2. 내용(작가명/설명) 개별 수정 저장
    async function handleUpdateAuthor() {
      const newAuthor = document.getElementById('authorInput').value.trim();
      if (!newAuthor) {
        alert("내용을 입력해주세요.");
        return;
      }

      try {
        const docRef = doc(db, "arts", artId);
        await updateDoc(docRef, { author: newAuthor });
        alert("작품 내용이 수정되었습니다!");
      } catch (err) {
        console.error(err);
        alert("내용 수정 중 오류가 발생했습니다.");
      }
    }

    // 3. 이어서 작업하기
    function handleContinueWork() {
      if (!currentArtData) return;
      sessionStorage.setItem('edit_target_art_id', artId);
      sessionStorage.setItem('edit_target_art_data', JSON.stringify(currentArtData));
      window.location.href = './canvas/canvas.html';
    }

    // 4. 작품 복제하기
    async function handleDuplicateArt() {
      if (!currentArtData) return;
      try {
        const newDocRef = await addDoc(collection(db, "arts"), {
          title: (currentArtData.title || '작품') + ' (복사본)',
          author: currentArtData.author || '나',
          preview: currentArtData.preview,
          width: currentArtData.width || 16,
          height: currentArtData.height || 16,
          createdAt: new Date()
        });

        let myArts = JSON.parse(localStorage.getItem('my_pixel_arts') || '[]');
        myArts.unshift(newDocRef.id);
        localStorage.setItem('my_pixel_arts', JSON.stringify(myArts));

        alert("작품이 성공적으로 복제되었습니다!");
        window.location.href = `./detail.html?id=${newDocRef.id}`;
      } catch (err) {
        console.error(err);
        alert("복제 중 오류가 발생했습니다.");
      }
    }

    // 5. 작품 삭제
    async function handleDeleteArt() {
      if (!confirm("정말 이 작품을 삭제하시겠습니까? (복구할 수 없습니다)")) return;

      try {
        const docRef = doc(db, "arts", artId);
        await deleteDoc(docRef);

        let myArts = JSON.parse(localStorage.getItem('my_pixel_arts') || '[]');
        myArts = myArts.filter(id => id !== artId);
        localStorage.setItem('my_pixel_arts', JSON.stringify(myArts));

        alert("작품이 삭제되었습니다.");
        window.location.href = './index.html';
      } catch (err) {
        console.error(err);
        alert("삭제 중 오류가 발생했습니다.");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadArtDetail();

      document.getElementById('updateTitleBtn').addEventListener('click', handleUpdateTitle);
      document.getElementById('updateAuthorBtn').addEventListener('click', handleUpdateAuthor);
      document.getElementById('continueBtn').addEventListener('click', handleContinueWork);
      document.getElementById('duplicateBtn').addEventListener('click', handleDuplicateArt);
      document.getElementById('deleteBtn').addEventListener('click', handleDeleteArt);
      document.getElementById('exitBtn').addEventListener('click', () => {
        window.location.href = './index.html';
      });
    });
  </script>
</head>
<body>

  <top-nav>
    <div class="nav-title">🐱 작품 상세 관리</div>
    <a href="./index.html" class="nav-btn">← 내 갤러리로 돌아가기</a>
  </top-nav>

  <container>
    <div id="loadingView" class="loading-msg">작품 정보를 가져오는 중...</div>

    <div id="contentView" class="detail-card" style="display: none;">
      <div class="preview-box">
        <img id="previewImg" class="preview-img" alt="Pixel Art Preview">
      </div>

      <!-- 제목 수정 그룹 (입력창 + 옆에 저장 버튼) -->
      <div class="info-group">
        <label>작품 제목</label>
        <div class="input-row">
          <input type="text" id="titleInput" class="info-input">
          <button id="updateTitleBtn" class="btn-inline-save">제목 저장</button>
        </div>
      </div>

      <!-- 내용(작가명/설명) 수정 그룹 (입력창 + 옆에 저장 버튼) -->
      <div class="info-group">
        <label>내용 (작가명 / 설명)</label>
        <div class="input-row">
          <input type="text" id="authorInput" class="info-input">
          <button id="updateAuthorBtn" class="btn-inline-save">내용 저장</button>
        </div>
      </div>

      <div class="header-divider"></div>

      <!-- 하단 액션 버튼들 -->
      <div class="action-buttons">
        <button id="continueBtn" class="action-btn btn-continue">이어서 작업</button>
        <button id="duplicateBtn" class="action-btn btn-duplicate">작품 복제</button>
        <button id="deleteBtn" class="action-btn btn-delete">작품 삭제</button>
      </div>

      <button id="exitBtn" class="btn-exit">나가기</button>
    </div>
  </container>

</body>
</html>
